name: CI

# Required GitHub Actions secrets
# ─────────────────────────────────
#   MAINNET_RPC_URL    Alchemy/Infura mainnet RPC. Used by forge fork tests
#                      (vm.createSelectFork). Optional today — no fork tests yet —
#                      but pre-wired so they "just work" when added.
#   CODECOV_TOKEN      Codecov upload token (private repos only). Optional for
#                      public repos.
#   SEMGREP_APP_TOKEN  Semgrep Cloud token. Optional; without it semgrep still
#                      gates the PR locally.
#   ETHERSCAN_API_KEY  NOT used by CI. Operator-only at deploy time
#                      (`yarn hardhat verify`). Keep in your local .env.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Forge build
        run: forge build --sizes

      - name: Forge test
        env:
          # Pre-wired for future fork tests (vm.envString("MAINNET_RPC_URL")).
          # Empty when the secret isn't set; pure unit tests don't read it.
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: forge test -vvv

      - name: Hardhat compile
        env:
          MNEMONIC: "test test test test test test test test test test test junk"
          INFURA_API_KEY: dummy
        run: yarn compile

      - name: Lint
        run: yarn lint

  slither:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies (needed for OZ remappings)
        run: yarn install --frozen-lockfile

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        id: slither
        with:
          target: "contracts/BridgeAdaptor.sol"
          slither-args: >-
            --filter-paths "lib/|node_modules/|contracts/test/|test/"
            --exclude naming-convention,solc-version,assembly,low-level-calls
            --fail-medium
          sarif: results.sarif

      - name: Upload SARIF to GitHub Security
        if: always() && steps.slither.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}

  aderyn:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Aderyn static analysis
        uses: Cyfrin/aderyn-ci@v0.0.10
        with:
          fail-on: high

  forge-fmt:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check Solidity formatting
        run: forge fmt --check

  coverage:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run forge coverage (lcov)
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: forge coverage --report lcov --report summary --no-match-coverage "(test|contracts/test)/"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./lcov.info
          flags: solidity
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fork-tests:
    # Fork integration suite — skipped on PRs from forks (secret unavailable) and on
    # private-repo PRs where MAINNET_RPC_URL isn't configured.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies (needed for OZ remappings)
        run: yarn install --frozen-lockfile

      - name: Run Forge fork tests
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::warning::MAINNET_RPC_URL secret not set; skipping fork tests."
            exit 0
          fi
          forge test --match-path "test/foundry/BridgeAdaptorFork.t.sol" -vvv

  semgrep:
    runs-on: [self-hosted, linux, x64]
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run Semgrep (Trail of Bits Solidity ruleset)
        # `semgrep ci` already exits non-zero on findings by default; no need for --error.
        run: |
          semgrep ci \
            --config p/trailofbits \
            --config p/smart-contracts \
            --exclude lib/ --exclude node_modules/ --exclude contracts/test/ --exclude test/
        env:
          # SEMGREP_APP_TOKEN is optional. With the token, results are uploaded to Semgrep Cloud
          # for trend tracking. Without it, this still runs locally and gates the PR.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
