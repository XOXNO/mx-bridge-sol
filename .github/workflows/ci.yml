name: CI

# Required GitHub Actions secrets
# ─────────────────────────────────
#   MAINNET_RPC_URL    Alchemy/Infura mainnet RPC. Used by forge fork tests
#                      (vm.createSelectFork). Optional today — no fork tests yet —
#                      but pre-wired so they "just work" when added.
#   CODECOV_TOKEN      Codecov upload token (private repos only). Optional for
#                      public repos.
#   SEMGREP_APP_TOKEN  Semgrep Cloud token. Optional; without it semgrep still
#                      gates the PR locally.
#   ETHERSCAN_API_KEY  NOT used by CI. Operator-only at deploy time
#                      (`yarn hardhat verify`). Keep in your local .env.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Forge build
        run: forge build --sizes

      - name: Forge test
        env:
          # Pre-wired for future fork tests (vm.envString("MAINNET_RPC_URL")).
          # Empty when the secret isn't set; pure unit tests don't read it.
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: forge test -vvv

      - name: Hardhat compile
        env:
          MNEMONIC: "test test test test test test test test test test test junk"
          INFURA_API_KEY: dummy
        run: yarn compile

      - name: Lint
        run: yarn lint

  slither:
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      security-events: write
      # `actions: read` is required by github/codeql-action/upload-sarif to fetch
      # the parent workflow-run metadata when posting SARIF.
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies (needed for OZ remappings)
        run: yarn install --frozen-lockfile

      - name: Setup Python
        # The system Python on the self-hosted runner (Debian 12) ships without the
        # python3-venv package, and PEP 668 blocks `pip install --user`. Use
        # actions/setup-python to drop in a self-contained Python with venv + pip
        # working out of the box; no apt-sudo required.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        # Run slither directly on the host (not via crytic/slither-action). Reasons:
        #   - The action runs slither inside its own container which does NOT have
        #     forge installed, so `slither contracts/...` crashes with
        #     `FileNotFoundError: 'forge'` when it tries to compile.
        #   - The host runner has foundry-toolchain installed above, so slither's
        #     Foundry-aware compile resolution works out of the box.
        #   - Also avoids the action's Node 20 deprecation warning.
        run: |
          python -m pip install --upgrade pip
          python -m pip install slither-analyzer

      - name: Run Slither
        id: slither
        # `set +e` swallows slither's exit code so the SARIF upload step still runs.
        # The `--fail-medium` flag still records non-zero exit; we re-evaluate below.
        #
        # Excluded detectors (all confirmed false positives in this contract; each one
        # has been reviewed manually and during prior multi-agent audits — keep this
        # list minimal so genuinely new findings still surface):
        #   naming-convention, solc-version, assembly, low-level-calls
        #     — style/version noise that doesn't apply (we pin to 0.8.35 deliberately,
        #       use OZ's safeTransfer assembly, etc.).
        #   incorrect-equality
        #     — fires on `amount == 0` and `recipient == bytes32(0)` input validation,
        #       which is the standard Solidity idiom — there is no oracle/storage
        #       comparison here that would be "dangerous".
        #   reentrancy-balance
        #     — fires on the post-call balance-delta check in `_depositToSafe`. All
        #       entry points are nonReentrant, the Safe is a trusted custody contract
        #       (audited MultiversX bridge), and the check is the defense itself.
        #   unused-return
        #     — `wormholeTokenBridge.completeTransferWithPayload(encodedVm)` return
        #       value is intentionally ignored because we re-parse the VAA via
        #       `parseTransferWithPayload` to validate fields ourselves.
        #   unused-state
        #     — `__gap` storage reservation for upgrade safety; "unused" by design.
        run: |
          set +e
          slither contracts/BridgeAdaptor.sol \
            --filter-paths "lib/|node_modules/|contracts/test/|test/" \
            --exclude naming-convention,solc-version,assembly,low-level-calls,incorrect-equality,reentrancy-balance,unused-return,unused-state \
            --fail-medium \
            --sarif results.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub Security
        # Non-blocking: GitHub Code Scanning requires GitHub Advanced Security on
        # private repos. If unavailable, log a warning and continue — Slither's own
        # gate (the next step) is what fails CI on real findings.
        if: always() && hashFiles('results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Fail job on Slither medium+ findings
        if: always() && steps.slither.outputs.exit_code != '0'
        run: |
          echo "Slither exited with ${{ steps.slither.outputs.exit_code }} — medium or higher finding present."
          exit 1

  aderyn:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Aderyn static analysis
        uses: Cyfrin/aderyn-ci@v0.0.10
        with:
          fail-on: high

  forge-fmt:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check Solidity formatting
        run: forge fmt --check

  coverage:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run forge coverage (lcov)
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: forge coverage --report lcov --report summary --no-match-coverage "(test|contracts/test)/"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./lcov.info
          flags: solidity
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fork-tests:
    # Fork integration suite — skipped on PRs from forks (secret unavailable) and on
    # private-repo PRs where MAINNET_RPC_URL isn't configured.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2

      - name: Install yarn
        # Self-hosted runner ships node + npm only; install yarn into the user-writable
        # npm bin directory that setup-node@v6 has just placed on PATH.
        run: npm install -g yarn@1.22.22

      - name: Install dependencies (needed for OZ remappings)
        run: yarn install --frozen-lockfile

      - name: Run Forge fork tests
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -z "$MAINNET_RPC_URL" ]; then
            echo "::warning::MAINNET_RPC_URL secret not set; skipping fork tests."
            exit 0
          fi
          forge test --match-path "test/foundry/BridgeAdaptorFork.t.sol" -vvv

  semgrep:
    runs-on: [self-hosted, linux, x64]
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Run Semgrep (Trail of Bits Solidity ruleset)
        # `semgrep ci` already exits non-zero on findings by default; no need for --error.
        #
        # Excluded rules (style-only gas-perf advice from p/smart-contracts, not security):
        #   - non-payable-constructor: wants `constructor() payable` on an upgradeable
        #     implementation whose constructor only calls _disableInitializers(). The impl
        #     is never called via the proxy and must not receive ETH; payable is wrong.
        #   - use-nested-if: wants `if (a) if (b) revert ...` over `if (a && b) revert ...`.
        #     Micro-gas style preference; reduces readability for no security benefit.
        run: |
          semgrep ci \
            --config p/trailofbits \
            --config p/smart-contracts \
            --exclude lib/ --exclude node_modules/ --exclude contracts/test/ --exclude test/ \
            --exclude-rule solidity.performance.non-payable-constructor.non-payable-constructor \
            --exclude-rule solidity.performance.use-nested-if.use-nested-if
        env:
          # SEMGREP_APP_TOKEN is optional. With the token, results are uploaded to Semgrep Cloud
          # for trend tracking. Without it, this still runs locally and gates the PR.
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
