[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path  = 'cache_forge'
solc_version = '0.8.35'
optimizer = true
optimizer_runs = 200
bytecode_hash = 'none'
# Silence vendored-library noise (130+ Warning(2424) hits in
# wormhole-solidity-sdk/BytesParsing.sol from deprecated natspec memory-safe-assembly
# comments). Scope-limited so our own code still trips the warning if we write it.
ignored_warnings_from = ['lib/wormhole-solidity-sdk']
remappings = [
    'wormhole-sdk/=lib/wormhole-solidity-sdk/src/',
    '@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/',
    '@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/',
    'forge-std/=lib/forge-std/src/'
]

[fuzz]
runs = 5000
max_test_rejects = 1_000_000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[lint]
# forge-lint (default in forge-std v1.16+) surfaces style-only findings; security
# is gated by Slither, Aderyn, and Semgrep in CI. Restrict to high/medium and
# exclude two rules whose only hits are in test code:
#   - erc20-unchecked-transfer: contracts/test/ mocks use raw IERC20.transfer for
#     readability; production BridgeAdaptor.sol uses OZ SafeERC20 throughout.
#   - unsafe-typecast: one hit at test/foundry/BridgeAdaptor.t.sol L877 on
#     `uint160(raw & ((1 << 160) - 1))` — an explicit mask-then-cast, provably safe.
severity = ["high", "med"]
exclude_lints = ["erc20-unchecked-transfer", "unsafe-typecast"]

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
